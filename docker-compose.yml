services:
  mysql:
    image: mysql:8.0
    container_name: reservation_salles_mysql
    restart: unless-stopped
    env_file:
      - ./docker/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reservation_salles_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./docker/.env
    ports:
      - "8081:80"

  adminer:
    image: adminer:4
    container_name: reservation_salles_adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql_data:
