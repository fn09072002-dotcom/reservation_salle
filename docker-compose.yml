services:
  mysql:
    image: mysql:8.0
    container_name: reservation_salles_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: fatou_app
      MYSQL_PASSWORD: fatou123
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reservation_salles_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reservation_salles
      DB_USERNAME: fatou_app
      DB_PASSWORD: fatou123
    ports:
      - "8081:80"

volumes:
  mysql_data:
